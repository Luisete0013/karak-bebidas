<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#151515">
  <title>KARAK Bebidas</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#151515; color:#e4c477; font-family:Arial,sans-serif; text-align:center; }
    main { width:100%; max-width:440px; padding:32px 24px; border:1px solid #5b4a28; border-radius:16px; background:#1d1d1d; }
    h1 { letter-spacing:3px; margin-bottom:8px; }
    p { color:#eee; line-height:1.5; }
    #google-button { display:flex; justify-content:center; margin:28px 0 16px; min-height:44px; }
    #status { font-size:14px; overflow-wrap:anywhere; }
    .note { color:#aaa; font-size:12px; }
    .error { color:#ff9a8d !important; }
    .ok { color:#a8e6b0 !important; }
  </style>
</head>
<body>
  <main>
    <h1>KARAK BEBIDAS</h1>
    <p>Aplicación del club</p>
    <p>Accede con tu cuenta de Google para continuar.</p>
    <div id="google-button"></div>
    <p id="status" role="status" aria-live="polite">Cargando inicio de sesión...</p>
    <p class="note">Acceso en preparación. Las ventas, consumos y datos de socios siguen deshabilitados hasta completar y verificar la conexión segura.</p>
  </main>
  <script>
    const GOOGLE_CLIENT_ID = '598036183937-0o8qtrj6fdb7s694bppvs2n7dtua463c.apps.googleusercontent.com';
    const BACKEND_URL = 'https://script.google.com/macros/s/AKfycby8DVE2qESKb4x32bQKip1NmDRAIbCSC9mfCJJe8Q8h_LBCB9XMgeAOAa9N4Q-XY4u3/exec';

    function showStatus(message, kind) {
      const el = document.getElementById('status');
      el.textContent = message;
      el.className = kind || '';
    }

    function initializeGoogleLogin() {
      if (!window.google?.accounts?.id) {
        showStatus('No se ha podido cargar Google. Comprueba la conexión y recarga.', 'error');
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
        auto_select: false,
        cancel_on_tap_outside: true
      });

      google.accounts.id.renderButton(
        document.getElementById('google-button'),
        { theme:'filled_black', size:'large', shape:'pill', text:'signin_with', locale:'es', width:280 }
      );
      showStatus('Inicio de sesión preparado.');
    }

    async function handleCredentialResponse(response) {
      if (!response?.credential) {
        showStatus('Google no ha devuelto una credencial.', 'error');
        return;
      }

      showStatus('Google ha respondido. Validando la identidad en el servidor…');

      try {
        const result = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ credential: response.credential }),
          redirect: 'follow'
        });

        if (!result.ok) {
          throw new Error('HTTP_' + result.status);
        }

        const data = await result.json();

        if (!data.success || !data.authenticated) {
          showStatus(data.message || 'No se ha podido validar la identidad.', 'error');
          return;
        }

        if (!data.authorized || data.user?.role !== 'admin') {
          showStatus('Identidad verificada, pero esta cuenta todavía no tiene permisos para usar la aplicación.', 'error');
          return;
        }

        // No se almacena el token ni se habilitan operaciones aún.
        showStatus('Identidad verificada para la cuenta administradora. La aplicación de gestión aún no está activada.', 'ok');
      } catch (error) {
        console.error('Error al conectar con KARAK backend:', error);
        showStatus('Google ha iniciado sesión, pero el navegador no ha podido leer la respuesta del servidor. La conexión entre GitHub Pages y Apps Script necesita resolverse; no se ha concedido acceso.', 'error');
      }
    }

    window.addEventListener('load', function () {
      let attempts = 0;
      const timer = setInterval(function () {
        attempts++;
        if (window.google?.accounts?.id) {
          clearInterval(timer);
          initializeGoogleLogin();
        } else if (attempts >= 30) {
          clearInterval(timer);
          showStatus('No se ha cargado Google. Recarga la página o revisa si el navegador bloquea el servicio.', 'error');
        }
      }, 300);
    });
  </script>
</body>
</html>
