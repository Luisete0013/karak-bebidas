
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>KARAK Bebidas</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #151515;
      color: #e4c477;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      border: 1px solid #5b4a28;
      border-radius: 16px;
      background: #1d1d1d;
    }

    h1 {
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    p {
      color: #eee;
      line-height: 1.5;
    }

    #google-button {
      display: flex;
      justify-content: center;
      margin: 28px 0 16px;
      min-height: 44px;
    }

    #status {
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .note {
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main>
    <h1>KARAK BEBIDAS</h1>
    <p>Aplicación del club</p>
    <p>Accede con tu cuenta de Google para continuar.</p>

    <div id="google-button"></div>
    <p id="status" role="status">Cargando inicio de sesión...</p>

    <p class="note">
      Prueba inicial. Todavía no se registran ventas
      ni se consultan datos de socios.
    </p>
  </main>

  <script>
    const GOOGLE_CLIENT_ID =
      '598036183937-0o8qtrj6fdb7s694bppvs2n7dtua463c.apps.googleusercontent.com';

    function showStatus(message) {
      document.getElementById('status').textContent = message;
    }

    function initializeGoogleLogin() {
      if (!window.google || !window.google.accounts ||
          !window.google.accounts.id) {
        showStatus(
          'No se ha podido cargar Google. Comprueba la conexión y recarga.'
        );
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById('google-button'),
        {
          theme: 'filled_black',
          size: 'large',
          shape: 'pill',
          text: 'signin_with',
          locale: 'es'
        }
      );

      showStatus('Inicio de sesión preparado.');
    }

    function handleCredentialResponse(response) {
      console.log('Respuesta de Google recibida:', !!response?.credential);
      if (response && response.credential) {
        showStatus(
          'Google ha respondido correctamente. ' +
          'Falta validar la identidad en el servidor.'
        );
      } else {
        showStatus('Google no ha devuelto una credencial.');
      }
    }

    window.addEventListener('load', function () {
      let attempts = 0;

      const timer = setInterval(function () {
        attempts++;

        if (window.google && window.google.accounts &&
            window.google.accounts.id) {
          clearInterval(timer);
          initializeGoogleLogin();
        } else if (attempts >= 30) {
          clearInterval(timer);
          showStatus(
            'No se ha cargado Google. Recarga la página o revisa si ' +
            'el navegador bloquea el servicio.'
          );
        }
      }, 300);
    });
  </script>
</body>
</html>
